[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -m "not lockout" --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
markers =
    stage0: scaffold and smoke tests (stack reachable, helpers work)
    stage1: user-service (8081)
    lockout: failed-login tests (lockout, wrong password, unknown email); opt-in with -m lockout, see README
    stage1_destructive: user-service tests that ban/lock throwaway merchants; never touch shared fixtures
    stage2: store-service (8084)
    stage3: product-service (8082)
    stage4: order-service (8083), end to end
    stage5: api-gateway (8080)
    gateway: runs through the api-gateway; keep under the auth tier budget (10 req/min/IP)
    slow: takes more than a few seconds (event waits, multi-step flows)
    skip_time_based(reason): depends on a timer that cannot be waited out; always skipped with the given reason
